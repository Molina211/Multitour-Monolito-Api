services:
  postgres:
    image: postgres:16-alpine
    container_name: multitour-postgres
    environment:
      POSTGRES_DB: multitour
      POSTGRES_USER: multitour
      POSTGRES_PASSWORD: multitour
    ports:
      - "5432:5432"
    volumes:
      - multitour-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U multitour -d multitour"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  multitour-postgres-data:
