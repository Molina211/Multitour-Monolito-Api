spring.application.name=travesia-natural

spring.datasource.url=jdbc:postgresql://localhost:5433/multitour
spring.datasource.username=multitour
spring.datasource.password=multitour

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT (spec 004 - login de End Customer). Ninguna HU fija el secreto ni la expiracion;
# se eligio 8 horas como valor razonable para una sesion de trabajo en el portal, y un
# secreto local solo para desarrollo. Igual que las credenciales de Postgres de arriba,
# ESTE SECRETO NO SIRVE PARA PRODUCCION: antes de desplegar hay que sobreescribirlo con
# una variable de entorno (por ejemplo APP_JWT_SECRET) con un valor generado aparte.
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-multitour-2026-cambiar-en-produccion-0123456789abcdef}
app.jwt.expiration-minutes=480

# Actuator (spec 028 - healthcheck real para docker-compose.yml). Solo health e info se
# exponen; el resto de endpoints de Actuator queda sin exponer. show-details=never
# porque el endpoint cae bajo anyRequest().permitAll() (spec 007): sin esto, cualquiera
# sin autenticar vería el detalle de componentes (ej. conectividad a Postgres).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
